name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Проект Pages живёт в подкаталоге репозитория.
      BASE_PATH: /tidy_clone/
      VITE_TIDY_API_URL: ${{ vars.VITE_TIDY_API_URL || 'https://tidy-api.megabaff2011.workers.dev' }}
      VITE_TIDY_CLIENT_TOKEN: ${{ secrets.VITE_TIDY_CLIENT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # GitHub Pages не знает про SPA: глубокие ссылки отдаются из 404.html.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
